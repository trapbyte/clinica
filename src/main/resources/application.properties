spring.application.name=clinica
server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5432/clinica
# Usuario y clave vienen de variables de entorno; nunca se suben al repositorio
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Jackson 3 ordena los campos alfabeticamente por defecto; se respeta el orden de los DTOs
spring.jackson.mapper.sort-properties-alphabetically=false
